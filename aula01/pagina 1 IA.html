<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackout</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Share+Tech+Mono&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --void: #08070b;
            --panel: #0f0d15;
            --violet: #7c3aed;
            --violet-bright: #a855f7;
            --steel: #52525b;
            --alert: #dc2626;
            --ink: #e7e5ea;
            --ink-dim: #8b8894;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--void);
            background-image:
                radial-gradient(ellipse 60% 50% at 50% 0%, rgba(124, 58, 237, 0.16), transparent 60%),
                repeating-linear-gradient(180deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Rajdhani', sans-serif;
            color: var(--ink);
            padding: 40px 20px;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 560px;
        }

        /* ---------- Card shell ---------- */
        .card {
            position: relative;
            width: 100%;
            background: linear-gradient(180deg, var(--panel), #0a0910);
            border: 1px solid rgba(124, 58, 237, 0.35);
            clip-path: polygon(0 18px, 18px 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%, 0 100%);
            padding: 2px;
            box-shadow: 0 0 0 1px rgba(0,0,0,0.6), 0 30px 80px -20px rgba(124, 58, 237, 0.35);
        }

        .card::before {
            content: "";
            position: absolute;
            inset: 0;
            clip-path: polygon(0 18px, 18px 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%, 0 100%);
            padding: 1px;
            background: linear-gradient(135deg, var(--violet-bright), transparent 30%, transparent 70%, var(--violet-bright));
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0.6;
            animation: pulse-edge 4s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes pulse-edge {
            0%, 100% { opacity: 0.35; }
            50% { opacity: 0.85; }
        }

        .card-inner {
            background: var(--panel);
            clip-path: polygon(0 18px, 18px 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%, 0 100%);
            padding: 36px 34px 30px;
        }

        /* ---------- Header / insignia ---------- */
        header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            margin-bottom: 6px;
        }

        .insignia {
            width: 74px;
            height: 74px;
            filter: drop-shadow(0 0 14px rgba(168, 85, 247, 0.55));
        }

        #logo {
            width: 74px;
            height: 74px;
            object-fit: contain;
            filter: drop-shadow(0 0 14px rgba(168, 85, 247, 0.55));
        }

        .eyebrow {
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.35em;
            color: var(--violet-bright);
            text-transform: uppercase;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 2.6rem;
            letter-spacing: 0.06em;
            margin: 0;
            text-align: center;
            color: var(--ink);
            text-shadow: 0 0 22px rgba(168, 85, 247, 0.45);
        }

        .status-line {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 11.5px;
            color: var(--alert);
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--alert);
            box-shadow: 0 0 8px var(--alert);
            animation: blink 1.6s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.25; }
        }

        hr.divider {
            width: 100%;
            border: none;
            height: 1px;
            margin: 26px 0 22px;
            background: linear-gradient(90deg, transparent, rgba(124, 58, 237, 0.5), transparent);
        }

        /* ---------- Data readout table ---------- */
        table {
            width: 100%;
            border-collapse: collapse;
            font-family: 'Share Tech Mono', monospace;
        }

        tr {
            color: var(--ink);
        }

        tr:not(:last-child) td {
            border-bottom: 1px solid rgba(124, 58, 237, 0.18);
        }

        td {
            padding: 13px 4px;
            font-size: 14px;
        }

        td:first-child {
            width: 34%;
            color: var(--ink-dim);
            font-size: 10.5px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            vertical-align: middle;
        }

        td:last-child {
            text-align: right;
            color: var(--ink);
            letter-spacing: 0.02em;
        }

        /* ---------- Footer ---------- */
        footer {
            margin-top: 28px;
            text-align: center;
        }

        footer p {
            font-family: 'Share Tech Mono', monospace;
            font-size: 10px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--ink-dim);
            margin: 0;
        }

        @media (max-width: 480px) {
            h1 { font-size: 2rem; }
            .card-inner { padding: 28px 20px 24px; }
            td:first-child, td:last-child { font-size: 12.5px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .card::before, .status-dot { animation: none; }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <div class="card-inner">
                <header>
                    <!-- Se você tiver o logo local, troque o src abaixo pelo caminho do arquivo -->
                    <img id="logo" src="toppng.com-decepticon-png-transparent-339x346.png" alt="Emblema"
                        onerror="this.replaceWith(document.getElementById('fallback-insignia').content.cloneNode(true))">
                    <template id="fallback-insignia">
                        <svg class="insignia" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                            <polygon points="50,4 92,27 92,73 50,96 8,73 8,27" fill="none" stroke="#a855f7" stroke-width="2.5"/>
                            <polygon points="50,20 78,35 78,65 50,80 22,65 22,35" fill="none" stroke="#7c3aed" stroke-width="1.5" opacity="0.7"/>
                            <circle cx="50" cy="50" r="9" fill="#a855f7"/>
                        </svg>
                    </template>
                    <span class="eyebrow">Registro de Contato</span>
                    <h1>BLACKOUT</h1>
                    <div class="status-line"><span class="status-dot"></span> Sinal ativo</div>
                </header>

                <hr class="divider">

                <table>
                    <tr>
                        <td>Nome</td>
                        <td>Sergio Gabriel</td>
                    </tr>
                    <tr>
                        <td>Telefone</td>
                        <td>(67) 67 67 67</td>
                    </tr>
                    <tr>
                        <td>Endereço</td>
                        <td>Rua Guerino Merli</td>
                    </tr>
                    <tr>
                        <td>CEP</td>
                        <td>065500-000</td>
                    </tr>
                </table>

                <footer>
                    <p>Todos os direitos reservados</p>
                </footer>
            </div>
        </div>
    </div>
</body>

</html>
